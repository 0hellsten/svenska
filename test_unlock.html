<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<audio id="app-speech-audio" preload="auto" playsinline webkit-playsinline style="display:none;"></audio>
<button id="btn-unlock">Unlock Audio</button>
<div id="log"></div>
<script>
  const log = (msg) => {
    document.getElementById('log').innerHTML += '<p>' + msg + '</p>';
    console.log(msg);
  };

  const audioEl = document.getElementById('app-speech-audio');

  // Silent 0.05s blank audio data URI
  const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

  document.getElementById('btn-unlock').addEventListener('click', async () => {
    log('Click event: Unlocking audio...');
    audioEl.src = SILENT_WAV;
    try {
      await audioEl.play();
      log('Audio element successfully UNLOCKED on user gesture!');
    } catch (e) {
      log('Unlock error: ' + e.message);
    }

    // Now test playing actual audio sequentially
    for (let i = 1; i <= 3; i++) {
      await new Promise((resolve) => {
        const text = i === 1 ? 'Hej' : i === 2 ? 'Tack så mycket' : 'God morgon';
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=sv&client=tw-ob&q=${encodeURIComponent(text)}`;
        audioEl.src = url;
        audioEl.oncanplay = () => {
          log(`Item ${i} (${text}) canplay, duration=${audioEl.duration}`);
        };
        audioEl.onended = () => {
          log(`Item ${i} (${text}) PLAYED SUCCESSFULLY!`);
          resolve();
        };
        audioEl.onerror = () => {
          log(`Item ${i} (${text}) error`);
          resolve();
        };
        audioEl.play().catch(e => {
          log(`Item ${i} (${text}) play error: ${e.message}`);
          resolve();
        });
      });
    }
  });

  // Trigger the click automatically in test
  document.getElementById('btn-unlock').click();
</script>
</body>
</html>
