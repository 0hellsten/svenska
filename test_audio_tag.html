<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="res">Testing...</div>
<script>
  const audio = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&tl=sv&client=tw-ob&q=Hej");
  audio.addEventListener('canplaythrough', () => {
    document.getElementById('res').innerText = "Audio loaded successfully! Duration: " + audio.duration;
  });
  audio.addEventListener('error', (e) => {
    document.getElementById('res').innerText = "Audio error: " + (audio.error ? audio.error.message || audio.error.code : 'unknown');
  });
</script>
</body>
</html>
